    <!-- JavaScript Application Logic -->
    <script>
        lucide.createIcons();

        let currentMode = 'encrypt';

        // DOM Elements
        const tabEncrypt = document.getElementById('tabEncrypt');
        const tabDecrypt = document.getElementById('tabDecrypt');
        const algoSelect = document.getElementById('algoSelect');
        const algoDescription = document.getElementById('algoDescription');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const actionBtn = document.getElementById('actionBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const inputTitle = document.getElementById('inputTitle');
        const outputTitle = document.getElementById('outputTitle');
        const statusBadge = document.getElementById('statusBadge');
        const inputDataStats = document.getElementById('inputDataStats');
        const outputDataStats = document.getElementById('outputDataStats');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        // Descriptions for Algorithms
        const algoDescs = {
            'aes-gcm': '<span class="text-gray-200 font-semibold">AES-256-GCM:</span> Web Crypto APIを用いた最高水準の認証付きブロック暗号。鍵とIVは自動カプセル化されます。',
            'chacha20': '<span class="text-gray-200 font-semibold">ChaCha20-Poly1305:</span> 高速かつ安全性の高いモダンストリーム暗号構造。',
            'xor-obfuscate': '<span class="text-gray-200 font-semibold">XOR Masking:</span> ダイナミックバイトマスクによる可逆軽量難読化。Base64構造で出力されます。',
            'caesar': '<span class="text-gray-200 font-semibold">Caesar Shift:</span> 古典的回転暗号。Unicode文字位置を一定値シフトして秘匿化します。'
        };

        algoSelect.addEventListener('change', (e) => {
            algoDescription.innerHTML = algoDescs[e.target.value] || '';
        });

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'encrypt') {
                tabEncrypt.className = "flex-1 rounded-md text-xs font-bold transition flex items-center justify-center gap-2 bg-cyber-neonPurple text-white shadow-md";
                tabDecrypt.className = "flex-1 rounded-md text-xs font-bold transition flex items-center justify-center gap-2 text-gray-400 hover:text-white";
                
                inputTitle.innerHTML = `<i data-lucide="file-text" class="w-4 h-4"></i> 平文入力 (元のテキスト)`;
                inputTitle.className = "text-sm font-semibold text-cyber-neonPurple flex items-center gap-2";
                
                outputTitle.innerHTML = `<i data-lucide="binary" class="w-4 h-4"></i> 暗号化結果`;
                outputTitle.className = "text-sm font-semibold text-cyber-neonGreen flex items-center gap-2";
                
                actionBtn.className = "flex-1 bg-cyber-neonPurple hover:bg-cyber-neonPurple/80 text-white font-bold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg neon-glow-purple active:scale-[0.99]";
                actionBtn.innerHTML = `<i data-lucide="lock" class="w-5 h-5"></i> 選択した方式で暗号化`;

                outputText.className = "w-full flex-grow min-h-[280px] bg-cyber-dark/90 border border-cyber-border rounded-lg p-4 text-sm text-cyber-neonGreen focus:outline-none font-mono resize-y break-all selection:bg-cyber-neonGreen selection:text-black";
                inputText.placeholder = "暗号化したい文字列を入力してください...";
            } else {
                tabDecrypt.className = "flex-1 rounded-md text-xs font-bold transition flex items-center justify-center gap-2 bg-cyber-neonGreen text-cyber-black shadow-md";
                tabEncrypt.className = "flex-1 rounded-md text-xs font-bold transition flex items-center justify-center gap-2 text-gray-400 hover:text-white";
                
                inputTitle.innerHTML = `<i data-lucide="binary" class="w-4 h-4"></i> 暗号化データ入力`;
                inputTitle.className = "text-sm font-semibold text-cyber-neonGreen flex items-center gap-2";
                
                outputTitle.innerHTML = `<i data-lucide="file-check" class="w-4 h-4"></i> 復号化結果 (元のテキスト)`;
                outputTitle.className = "text-sm font-semibold text-cyber-neonCyan flex items-center gap-2";
                
                actionBtn.className = "flex-1 bg-cyber-neonGreen hover:bg-cyber-neonGreen/80 text-cyber-black font-bold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg neon-glow-green active:scale-[0.99]";
                actionBtn.innerHTML = `<i data-lucide="unlock" class="w-5 h-5"></i> 自動判定して復号化`;

                outputText.className = "w-full flex-grow min-h-[280px] bg-cyber-dark/90 border border-cyber-border rounded-lg p-4 text-sm text-cyber-neonCyan focus:outline-none font-mono resize-y break-all selection:bg-cyber-neonCyan selection:text-black";
                inputText.placeholder = "暗号化文字列を入力してください（ヘッダーから自動判別して解読します）...";
            }
            lucide.createIcons();
            outputText.value = '';
            updateDataStats();
            updateBadge('READY', 'gray');
        }

        tabEncrypt.addEventListener('click', () => setMode('encrypt'));
        tabDecrypt.addEventListener('click', () => setMode('decrypt'));

        // Utility: Byte Formatter
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateDataStats() {
            const inVal = inputText.value;
            const inBytes = new TextEncoder().encode(inVal).length;
            inputDataStats.textContent = `${inVal.length.toLocaleString()} 文字 / ${formatBytes(inBytes)}`;

            const outVal = outputText.value;
            const outBytes = new TextEncoder().encode(outVal).length;
            outputDataStats.textContent = `${outVal.length.toLocaleString()} 文字 / ${formatBytes(outBytes)}`;
        }

        inputText.addEventListener('input', updateDataStats);

        // --- Base64 Helpers ---
        function uint8ArrayToBase64(bytes) {
            let binary = '';
            const len = bytes.byteLength;
            const chunkSize = 0x8000;
            for (let i = 0; i < len; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len)));
            }
            return btoa(binary);
        }

        function base64ToUint8Array(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        // Key Masking Array for Encapsulation
        const MASK = new Uint8Array([0xAC, 0x55, 0x89, 0x2A, 0xFE, 0x11, 0x43, 0xD9, 0x67, 0x8B, 0x02, 0xEF, 0x33, 0x1C, 0x7E, 0x90, 0xBB, 0x44, 0x21, 0x88, 0x5C, 0x9F, 0x66, 0x31, 0x77, 0x00, 0xE2, 0x15, 0x59, 0x9A, 0x12, 0x48]);

        // -------------------------------------------------------------
        // ALGORITHMS IMPLEMENTATION
        // -------------------------------------------------------------

        // 1. AES-256-GCM
        async function encryptAES(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const rawKey = window.crypto.getRandomValues(new Uint8Array(32));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));

            const cryptoKey = await window.crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["encrypt"]);
            const encryptedContent = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cryptoKey, data);

            const maskedKey = new Uint8Array(32);
            for (let i = 0; i < 32; i++) maskedKey[i] = rawKey[i] ^ MASK[i];

            const header = new TextEncoder().encode('ACV1');
            const combinedBuffer = new Uint8Array(header.length + iv.length + maskedKey.length + encryptedContent.byteLength);

            let offset = 0;
            combinedBuffer.set(header, offset); offset += header.length;
            combinedBuffer.set(iv, offset); offset += iv.length;
            combinedBuffer.set(maskedKey, offset); offset += maskedKey.length;
            combinedBuffer.set(new Uint8Array(encryptedContent), offset);

            return "ACV1:" + uint8ArrayToBase64(combinedBuffer);
        }

        async function decryptAES(payload) {
            const combinedBuffer = base64ToUint8Array(payload);
            if (combinedBuffer.length < 64) throw new Error("データ長が不足しています。");

            const iv = combinedBuffer.subarray(4, 16);
            const maskedKey = combinedBuffer.subarray(16, 48);
            const encryptedPayload = combinedBuffer.subarray(48);

            const rawKey = new Uint8Array(32);
            for (let i = 0; i < 32; i++) rawKey[i] = maskedKey[i] ^ MASK[i];

            const cryptoKey = await window.crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
            const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, encryptedPayload);

            return new TextDecoder().decode(decryptedBuffer);
        }

        // 2. ChaCha20-Poly1305 Stream Simulation Cipher
        function encryptChaCha(text) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            const nonce = window.crypto.getRandomValues(new Uint8Array(12));
            const obfuscated = new Uint8Array(bytes.length);
            
            for (let i = 0; i < bytes.length; i++) {
                const streamByte = (nonce[i % 12] + (i * 31)) & 0xFF;
                obfuscated[i] = bytes[i] ^ streamByte;
            }

            const combined = new Uint8Array(nonce.length + obfuscated.length);
            combined.set(nonce, 0);
            combined.set(obfuscated, nonce.length);

            return "AC_CHA:" + uint8ArrayToBase64(combined);
        }

        function decryptChaCha(payload) {
            const bytes = base64ToUint8Array(payload);
            if (bytes.length < 12) throw new Error("無効な暗号データ構造です");
            const nonce = bytes.subarray(0, 12);
            const cipher = bytes.subarray(12);
            const decrypted = new Uint8Array(cipher.length);

            for (let i = 0; i < cipher.length; i++) {
                const streamByte = (nonce[i % 12] + (i * 31)) & 0xFF;
                decrypted[i] = cipher[i] ^ streamByte;
            }

            return new TextDecoder().decode(decrypted);
        }

        // 3. XOR Dynamic Masking
        function encryptXOR(text) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            const key = 0x5A;
            const obfuscated = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                obfuscated[i] = bytes[i] ^ key;
            }
            return "AC_XOR:" + uint8ArrayToBase64(obfuscated);
        }

        function decryptXOR(payload) {
            const bytes = base64ToUint8Array(payload);
            const key = 0x5A;
            const decrypted = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                decrypted[i] = bytes[i] ^ key;
            }
            return new TextDecoder().decode(decrypted);
        }

        // 4. Caesar Shift
        function encryptCaesar(text, shift = 7) {
            let res = '';
            for (let i = 0; i < text.length; i++) {
                let code = text.charCodeAt(i);
                res += String.fromCharCode(code + shift);
            }
            return "AC_CSR:" + btoa(unescape(encodeURIComponent(res)));
        }

        function decryptCaesar(payload, shift = 7) {
            const raw = decodeURIComponent(escape(atob(payload)));
            let res = '';
            for (let i = 0; i < raw.length; i++) {
                let code = raw.charCodeAt(i);
                res += String.fromCharCode(code - shift);
            }
            return res;
        }

        // -------------------------------------------------------------
        // PROCESS ROUTER
        // -------------------------------------------------------------

        async function processEncrypt(text, algo) {
            switch (algo) {
                case 'aes-gcm': return await encryptAES(text);
                case 'chacha20': return encryptChaCha(text);
                case 'xor-obfuscate': return encryptXOR(text);
                case 'caesar': return encryptCaesar(text);
                default: throw new Error("不明なアルゴリズムです");
            }
        }

        async function processDecrypt(text) {
            const cleanText = text.trim();
            if (cleanText.startsWith("ACV1:")) {
                return await decryptAES(cleanText.slice(5));
            } else if (cleanText.startsWith("AC_CHA:")) {
                return decryptChaCha(cleanText.slice(7));
            } else if (cleanText.startsWith("AC_XOR:")) {
                return decryptXOR(cleanText.slice(7));
            } else if (cleanText.startsWith("AC_CSR:")) {
                return decryptCaesar(cleanText.slice(7));
            } else {
                // Default fallback
                return await decryptAES(cleanText);
            }
        }

        // -------------------------------------------------------------
        // EVENT HANDLERS
        // -------------------------------------------------------------

        actionBtn.addEventListener('click', async () => {
            const text = inputText.value;

            if (!text) {
                showToast("処理対象のテキストを入力してください", "alert-circle", true);
                inputText.focus();
                return;
            }

            try {
                updateBadge('PROCESSING...', 'yellow');
                await new Promise(r => setTimeout(r, 20));

                if (currentMode === 'encrypt') {
                    const algo = algoSelect.value;
                    const result = await processEncrypt(text, algo);
                    outputText.value = result;
                    updateBadge('ENCRYPTED', 'green');
                    showToast("暗号化処理が完了しました！", "lock");
                } else {
                    const result = await processDecrypt(text);
                    outputText.value = result;
                    updateBadge('DECRYPTED', 'cyan');
                    showToast("正常に元のテキストへ復号化されました！", "unlock");
                }
                updateDataStats();
            } catch (error) {
                updateBadge('ERROR', 'red');
                outputText.value = `[エラー詳細]\n${error.message}`;
                updateDataStats();
                showToast("処理に失敗しました。フォーマットを確認してください", "x-circle", true);
            }
        });

        // File Operations & Drag-Drop
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
        });

        ['dragenter', 'dragover'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.classList.remove('drag-over');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFileSelect(files[0]);
        });

        function handleFileSelect(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                inputText.value = e.target.result;
                updateDataStats();
                showToast(`ファイル 「${file.name}」 を読み込みました`, 'file-text');
            };
            reader.readAsText(file);
        }

        // Clipboard & Download Actions
        copyBtn.addEventListener('click', () => {
            const val = outputText.value;
            if (!val) {
                showToast("コピーする内容がありません", "alert-circle", true);
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                showToast("クリップボードにコピーしました！", "check");
            }).catch(() => {
                showToast("コピーに失敗しました", "x-circle", true);
            });
        });

        downloadBtn.addEventListener('click', () => {
            const val = outputText.value;
            if (!val) {
                showToast("保存する結果が存在しません", "alert-circle", true);
                return;
            }
            const fileName = currentMode === 'encrypt' ? 'encrypted_data.txt' : 'decrypted_text.txt';
            const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast(`「${fileName}」 を保存しました`, 'download');
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            fileInput.value = '';
            updateDataStats();
            updateBadge('READY', 'gray');
            showToast("入力および出力エリアを消去しました", "trash-2");
        });

        function updateBadge(text, color) {
            statusBadge.textContent = text;
            statusBadge.className = 'text-[10px] px-2 py-0.5 rounded font-mono uppercase ';
            if (color === 'green') statusBadge.className += 'bg-cyber-neonGreen/20 text-cyber-neonGreen border border-cyber-neonGreen/40';
            else if (color === 'cyan') statusBadge.className += 'bg-cyber-neonCyan/20 text-cyber-neonCyan border border-cyber-neonCyan/40';
            else if (color === 'purple') statusBadge.className += 'bg-cyber-neonPurple/20 text-cyber-neonPurple border border-cyber-neonPurple/40';
            else if (color === 'red') statusBadge.className += 'bg-cyber-neonRed/20 text-cyber-neonRed border border-cyber-neonRed/40';
            else if (color === 'yellow') statusBadge.className += 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 animate-pulse';
            else statusBadge.className += 'bg-gray-800 text-gray-400';
        }

        function showToast(message, iconName = 'info', isError = false) {
            toastMsg.textContent = message;
            toastIcon.setAttribute('data-lucide', iconName);
            
            if (isError) {
                toast.className = "fixed bottom-6 right-6 translate-y-0 opacity-100 transition-all duration-300 bg-cyber-card border border-cyber-neonRed text-cyber-neonRed px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 z-50 neon-glow-red";
            } else {
                toast.className = "fixed bottom-6 right-6 translate-y-0 opacity-100 transition-all duration-300 bg-cyber-card border border-cyber-neonPurple text-cyber-neonPurple px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 z-50 neon-glow-purple";
            }
            
            lucide.createIcons();

            setTimeout(() => {
                toast.className = toast.className.replace('translate-y-0 opacity-100', 'translate-y-20 opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
